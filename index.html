<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Samui NPA Map</title>
<link rel="stylesheet" href="leaflet.css"><!-- Leaflet 1.9.4 stylesheet, kept next to the page so the hosted copy (claude.ai artifact) can load it -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root { --bg:#fff; --fg:#1b1b1b; --muted:#666; --panel:#f6f6f4; --border:#ddd; --accent:#0b6e4f;
          --land:#2a9d8f; --house:#e76f51; --townhouse:#f4a261; --condo:#457b9d; --commercial:#8e44ad; --other:#777; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#15171a; --fg:#e8e8e8; --muted:#9a9a9a; --panel:#1f2226; --border:#333; } }
  :root[data-theme="dark"] { --bg:#15171a; --fg:#e8e8e8; --muted:#9a9a9a; --panel:#1f2226; --border:#333; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif; }
  #app { display:grid; grid-template-columns: 320px 1fr; height:100%; }
  #side { background:var(--panel); border-right:1px solid var(--border); padding:14px 16px; overflow:auto; }
  #map { height:100%; position:relative; }
  #updates { position:absolute; top:10px; right:10px; z-index:1000; width:340px; max-height:60vh; overflow:auto; background:var(--panel);
    border:1px solid var(--border); border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.15); font-size:12px; }
  #updates .hd { display:flex; justify-content:space-between; align-items:center; padding:8px 10px; font-weight:600; cursor:pointer; position:sticky; top:0; background:var(--panel); border-bottom:1px solid var(--border); }
  #updates.closed .bd { display:none; }
  #updates .day { padding:6px 10px 2px; color:var(--muted); font-weight:600; cursor:pointer; border-top:1px solid var(--border); }
  #updates .day.closed + .rows { display:none; }
  #updates .ev { padding:4px 10px; cursor:pointer; border-top:1px dotted var(--border); }
  #updates .ev:hover { background:rgba(127,127,127,.08); }
  #updates .ev .m { color:var(--muted); }
  .badge { display:inline-block; font-size:10px; font-weight:600; padding:0 5px; border-radius:3px; color:#fff; margin-right:4px; }
  .badge.target { background:#e0a800; color:#222; } .badge.dup { background:#999; } .badge.verified { background:#2a9d8f; }
  .badge.broker { background:#c2185b; } .badge.npa { background:#555; } .dot.ring { background:transparent; border:2px solid #c2185b; }
  .agg { background:rgba(70,70,70,.88); color:#fff; border:2px dashed #fff; border-radius:50%; display:flex; align-items:center; justify-content:center;
         font-weight:600; font-size:12px; box-shadow:0 0 0 2px rgba(0,0,0,.3); cursor:pointer; }
  .popup .ai { padding:2px 0; border-top:1px dotted var(--border); }
  .lbl { background:rgba(255,255,255,.85); border:1px solid rgba(0,0,0,.25); border-radius:3px; padding:0 3px; font-size:10px; font-weight:600; color:#222; box-shadow:none; }
  .lbl.star { background:#fff3c4; border-color:#e0a800; }
  .lbl::before { display:none; }
  .badge.new { background:var(--accent); } .badge.relisted { background:#2a7fd4; } .badge.price { background:#d4882a; } .badge.offmarket { background:#c0392b; }
  h1 { font-size:17px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:12px; }
  fieldset { border:1px solid var(--border); border-radius:6px; margin:0 0 10px; padding:8px 10px; }
  legend { font-size:12px; color:var(--muted); padding:0 4px; }
  label.chk { display:flex; align-items:center; gap:6px; margin:2px 0; cursor:pointer; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; border:1px solid rgba(0,0,0,.3); }
  .row { display:flex; gap:6px; align-items:center; }
  input[type=number], select { width:100%; box-sizing:border-box; padding:4px 6px; border:1px solid var(--border);
    border-radius:4px; background:var(--bg); color:var(--fg); }
  .count { font-weight:600; margin:8px 0; }
  #list { font-size:12px; }
  #list .it { padding:6px 0; border-top:1px solid var(--border); cursor:pointer; }
  #list .it:hover { background:rgba(127,127,127,.08); }
  #list .p { font-weight:600; }
  #list .m { color:var(--muted); }
  .stale { opacity:.55; }
  .off { display:inline-block; background:#c0392b; color:#fff; font-size:11px; font-weight:600; padding:0 5px; border-radius:3px; margin-right:4px; }
  #list .offm .p { text-decoration: line-through; color:var(--muted); }
  .popup b { font-size:13px; }
  .popup .k { color:var(--muted); }
  .popup img { max-width:220px; max-height:140px; display:block; margin-top:6px; border-radius:4px; }
  .popup a img { cursor: zoom-in; }
  #err { color:#b00020; font-size:12px; white-space:pre-wrap; }
  button { padding:4px 10px; border:1px solid var(--border); border-radius:4px; background:var(--bg); color:var(--fg); cursor:pointer; white-space:nowrap; }
  @media (max-width:760px) { #app { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    #side { max-height:45vh; border-right:0; border-bottom:1px solid var(--border); padding:12px 16px; } }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="row" style="justify-content:space-between"><h1 data-i18n="title">Ko Samui NPA listings</h1>
      <select id="lang" style="width:auto"><option value="en">EN</option><option value="zh">中文</option><option value="th">ไทย</option></select></div>
    <div class="sub" id="meta">loading data/listings.json…</div>
    <input id="q" type="search" data-i18n-ph="search" placeholder="search: case no., deed no., code, title, tambon" style="width:100%;box-sizing:border-box;padding:5px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--fg);margin-bottom:8px">
    <div id="err"></div>
    <fieldset><legend data-i18n="target">Target land</legend>
      <label class="chk"><input id="tgt" type="checkbox"> <span class="badge target">★</span><span data-i18n="tgt_on">only matching: land ≥ 2 ngan, near a main road or the beach, not the south</span> <span class="m" id="n-tgt"></span></label>
      <div class="row" style="margin-top:4px;flex-wrap:wrap;gap:4px 10px">
        <label class="m"><span data-i18n="tgt_min">min sq.wa</span> <input id="tgt-min" type="number" value="200" min="0" style="width:62px"></label>
        <label class="m"><span data-i18n="tgt_lat">south limit (lat)</span> <input id="tgt-lat" type="number" value="9.49" step="0.01" style="width:62px"></label>
        <label class="m"><span data-i18n="tgt_coast">≤ m to beach</span> <input id="tgt-coast" type="number" value="300" min="0" step="50" style="width:62px"></label>
        <label class="m"><span data-i18n="tgt_road">≤ m to main road</span> <input id="tgt-road" type="number" value="150" min="0" step="50" style="width:62px"></label>
      </div>
    </fieldset>
    <fieldset><legend data-i18n="group">Listing group</legend>
      <label class="chk"><input id="g-npa" type="checkbox" checked> <span class="dot" style="background:#222"></span><span data-i18n="g_npa">bank / AMC / court auction (NPA)</span> <span class="m" id="n-g-npa"></span></label>
      <label class="chk"><input id="g-broker" type="checkbox" checked> <span class="dot ring"></span><span data-i18n="g_broker">owner / agent classifieds</span> <span class="m" id="n-g-broker"></span></label>
    </fieldset>
    <fieldset><legend data-i18n="ptype">Property type</legend><div id="types"></div>
      <div class="m" style="margin-top:4px" data-i18n="agg_hint">dashed pins = no exact position (placed at a fixed spot inside the sub-district)</div>
      <div class="m" data-i18n="star_hint">gold ring = matches the target-land criteria; zoomed in, every pin shows its price (land: per rai)</div></fieldset>
    <fieldset><legend data-i18n="source">Source</legend><div id="sources"></div></fieldset>
    <fieldset><legend data-i18n="price">Price (THB)</legend>
      <div class="row"><input id="pmin" type="number" placeholder="min" step="100000">
        <span>–</span><input id="pmax" type="number" placeholder="max" step="100000"></div>
      <label class="chk" style="margin-top:6px"><input id="nopx" type="checkbox" checked> <span data-i18n="nopx">include listings without price</span></label>
    </fieldset>
    <fieldset><legend data-i18n="other">Other</legend>
      <label class="chk"><input id="fresh" type="checkbox"> <span data-i18n="fresh">only seen in last crawl</span></label>
      <label class="chk"><input id="exactgeo" type="checkbox"> <span data-i18n="exactgeo">only exact / geocoded pins</span></label>
      <label class="chk"><input id="hideoff" type="checkbox"> <span data-i18n="hideoff">hide withdrawn / sold</span></label>
      <label class="chk"><input id="hidedup" type="checkbox" checked> <span data-i18n="hidedup">hide suspected re-posts of the same property</span> <span class="m" id="n-dup"></span></label>
      <label class="chk"><input id="agg" type="checkbox"> <span data-i18n="agg">group approximate pins into one circle per sub-district (until zoomed in)</span></label>
      <div class="row" style="margin-top:6px"><select id="sort">
        <option value="price" data-i18n="sort_price">sort: price ↑</option><option value="sqwa" data-i18n="sort_sqwa">sort: ฿/sq.wa ↑</option>
        <option value="seen" data-i18n="sort_seen">sort: first seen ↓</option></select>
        <button id="reset" data-i18n="reset">reset</button></div>
    </fieldset>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </aside>
  <div id="map">
    <div id="updates" class="closed"><div class="hd" id="upd-hd"><span></span><span id="upd-toggle">▾</span></div><div class="bd" id="upd-bd"></div></div>
  </div>
</div>

  }
  const targetBadge = l => matchesTarget(l) ? `<span class="badge target">★ ${t('tgt_badge')}</span>` : '';
  const flagBadges = l => ((l.details || {}).duplicate_of ? `<span class="badge dup">${t('dup_badge')}</span>` : '') + ((l.details || {}).verified ? `<span class="badge verified">✓</span>` : '');

  const fmtPrice = p => p == null ? t('noprice') : (p >= 1e6 ? (p / 1e6).toFixed(2) + ' M฿' : Math.round(p).toLocaleString() + ' ฿');
  const fmtPerRai = l => l.price_per_sqwa ? fmtPrice(l.price_per_sqwa * 400) + t('perrai') : '';
  const fmtArea = a => { if (a == null) return '–'; const rai = Math.floor(a / 400), ngan = Math.floor((a % 400) / 100), wa = +(a % 100).toFixed(1);
    return (rai || ngan) ? `${rai}-${ngan}-${wa} ${t('rai')} (${a.toFixed(0)} ${t('sqwa')})` : `${wa} ${t('sqwa')}`; };
  // one-line heading built from structured fields, so it is readable even when the Thai title is not translatable
  const heading = l => [term('type', l.property_type || 'other'), l.tambon ? tr(l.tambon) : null, l.source_id].filter(Boolean).join(' · ');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function buildFilters() {
    $('types').innerHTML = TYPES.map(t => `<label class="chk"><input type="checkbox" data-type="${t}" checked>
      <span class="dot" style="background:${css(TYPE_COLOR[t])}"></span>${term('type', t)} <span class="m" id="n-${t}"></span></label>`).join('');
    const srcs = [...new Set(all.map(l => l.source))].sort();
    const srcRow = s => `<label class="chk"><input type="checkbox" data-src="${s}" checked>${s}
      <span class="m">(${all.filter(l => l.source === s).length})</span></label>`;
    const brokers = srcs.filter(s => kindOf(s) === 'broker'), npa = srcs.filter(s => kindOf(s) !== 'broker');
    $('sources').innerHTML = ((npa.length ? `<div class="m">${t('g_npa')}</div>` + npa.map(srcRow).join('') : '')
      + (brokers.length ? `<div class="m" style="margin-top:4px">${t('g_broker')}</div>` + brokers.map(srcRow).join('') : '')) || '<span class="m">no listings yet</span>';
    document.querySelectorAll('#side input, #side select').forEach(el => { if (el.id !== 'lang') el.addEventListener('input', render); });
    $('reset').onclick = () => { document.querySelectorAll('#side input[type=checkbox]').forEach(c => c.checked = c.id === 'nopx' || c.id === 'hidedup' || c.id.startsWith('g-') || !!(c.dataset.type || c.dataset.src));   // 'agg' and 'tgt' stay off
      $('pmin').value = ''; $('pmax').value = ''; $('sort').value = 'price'; render(); };
  }

  function filtered() {
    const types = new Set([...document.querySelectorAll('[data-type]:checked')].map(c => c.dataset.type));
    const srcs = new Set([...document.querySelectorAll('[data-src]:checked')].map(c => c.dataset.src));
    const pmin = parseFloat($('pmin').value), pmax = parseFloat($('pmax').value);
    const nopx = $('nopx').checked, fresh = $('fresh').checked, exact = $('exactgeo').checked, hideoff = $('hideoff').checked;
    const q = $('q').value.trim().toLowerCase();
    const gNpa = $('g-npa').checked, gBroker = $('g-broker').checked, hidedup = $('hidedup').checked;
    // free-text match over id, title, address, deed, case number and the raw record (LED: law_suit_no, deedno, collCode …)
    const hay = l => [l.id, l.title, l.address, l.tambon, (l.details || {}).deed, JSON.stringify(l.raw || {})].join(' ').toLowerCase();
    return all.filter(l => {
      if (!types.has(l.property_type || 'other') || !srcs.has(l.source)) return false;
      if (isBroker(l) ? !gBroker : !gNpa) return false;
      if ($('tgt').checked && !matchesTarget(l)) return false;
      if (hidedup && !q && (l.details || {}).duplicate_of) return false;   // a search must still find a hidden re-post
      if (l.price_thb == null) { if (!nopx) return false; }
      else { if (!isNaN(pmin) && l.price_thb < pmin) return false; if (!isNaN(pmax) && l.price_thb > pmax) return false; }
      if (fresh && lastCrawl && l.last_seen !== lastCrawl) return false;
      if (exact && !['exact', 'geocoded', 'parcel'].includes(l.geo_precision)) return false;
      if (hideoff && offMarket(l)) return false;
      if (q && !hay(l).includes(q)) return false;
      return l.lat != null && l.lng != null;
    });
  }

  function popup(l) {
    const hist = (l.price_history || []).length > 1 ? `<div class="k">${t('hist')}: ${l.price_history.map(h => `${h.date} ${fmtPrice(h.price_thb)}`).join(' → ')}</div>` : '';
    const img = (l.images || []).slice(0, 2).map(u => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="" loading="lazy"></a>`).join('');   // LED: photo + plaintiff's sketch map
    const title = tr(l.title || l.id);
    const orig = lang !== 'th' && hasThai(l.title) ? `<div class="k" lang="th">${t('original')}: ${esc(l.title)}</div>` : '';
    return `<div class="popup">${groupBadge(l)}${targetBadge(l)}${flagBadges(l)}<b>${esc(heading(l))}</b>
      <div>${esc(title)}</div>${orig}
      <div>${fmtPrice(l.price_thb)} ${l.price_per_sqwa ? `<span class="k">(${fmtPerRai(l)})</span>` : ''}</div>
      <div><span class="k">${t('area')}:</span> ${fmtArea(l.area_sqwa)}</div>
      <div><span class="k">${t('type')}:</span> ${esc(term('type', l.property_type || 'other'))} · <span class="k">${t('sale')}:</span> ${esc(term('sale', l.sale_method))}${l.auction_date ? ` · ${t('auction')} ` + esc(l.auction_date) : ''}</div>
      <div><span class="k">${t('address')}:</span> ${esc(tr(l.address) || '-')}</div>
      <div><span class="k">${t('pin')}:</span> ${esc(term('pin', l.geo_precision))}</div>
      ${detailsHtml(l)}
      <div><span class="k">${t('first')}</span> ${esc(l.first_seen)} · <span class="k">${t('last')}</span> ${esc(l.last_seen)}</div>
      ${hist}
      <div><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(t('open', { src: l.source }))}</a></div>${l.source === 'thaihometown' ? `<div class="k">${esc(t('mobile_only'))}</div>` : ''}${img}</div>`;
  }

  const EXPLODE_ZOOM = 15, LABEL_ZOOM = 16;
  const starStyle = (l, style) => matchesTarget(l) ? { ...style, color: '#e0a800', weight: 3 } : style;
  const label = l => (l.property_type === 'land' && l.price_per_sqwa) ? fmtPrice(l.price_per_sqwa * 400) + t('perrai') : fmtPrice(l.price_thb);
  const attachLabel = (m, l) => { if (map.getZoom() >= LABEL_ZOOM) m.bindTooltip(`${matchesTarget(l) ? '★ ' : ''}${label(l)}`, { permanent: true, direction: 'top', offset: [0, -8], className: 'lbl' + (matchesTarget(l) ? ' star' : '') }); };
  const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; };
  function aggPopup(g) {
    const items = g.rows.map(l => `<div class="ai"><span class="dot" style="background:${css(TYPE_COLOR[l.property_type] || '--other')}"></span> ${targetBadge(l)}${fmtPrice(l.price_thb)}${l.price_per_sqwa ? ` <span class="k">(${fmtPerRai(l)})</span>` : ''} · ${fmtArea(l.area_sqwa)} · ${esc(term('type', l.property_type || 'other'))} · <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(tr(l.title || l.id).slice(0, 40))}</a></div>`).join('');
    return `<div class="popup"><b>${esc(g.name)}</b> · ${esc(t('agg_n', { n: g.rows.length }))}<div class="k">${esc(t('agg_hint'))} · ${esc(t('agg_zoom'))}</div>
      <div style="max-height:260px;overflow:auto;margin-top:4px">${items}</div>
      <div style="margin-top:4px"><a href="#" class="agg-list">${esc(t('agg_list', { n: g.rows.length }))}</a></div></div>`;
  }
  let lastExploded = false, lastLabeled = false;
  map.on('zoomend', () => { const z = map.getZoom();
    if (($('agg').checked && (z >= EXPLODE_ZOOM) !== lastExploded) || (z >= LABEL_ZOOM) !== lastLabeled) { lastExploded = z >= EXPLODE_ZOOM; lastLabeled = z >= LABEL_ZOOM; render(); } });

  function render() {
    const rows = filtered();
    const sort = $('sort').value;
    rows.sort((a, b) => sort === 'seen' ? String(b.first_seen).localeCompare(String(a.first_seen))
      : sort === 'sqwa' ? ((a.price_per_sqwa ?? Infinity) - (b.price_per_sqwa ?? Infinity))
      : ((a.price_thb ?? Infinity) - (b.price_thb ?? Infinity)));
    layer.clearLayers(); markers.clear();
    // Listings known only to sub-district level are NOT scattered around the centroid (a spiral of fake positions
    // that re-shuffles on every filter change); they become one dashed grey circle per sub-district with the count.
    const groups = new Map(), seen = {};
    for (const l of rows) {
      if (!['exact', 'geocoded', 'parcel'].includes(l.geo_precision)) {
        const k = l.lat.toFixed(4) + ',' + l.lng.toFixed(4);
        if (!groups.has(k)) groups.set(k, { lat: l.lat, lng: l.lng, name: (l.details || {}).place ? tr(l.details.place) : (l.tambon ? tr(l.tambon) : tr('เกาะสมุย')), rows: [] });
        groups.get(k).rows.push(l);
        continue;
      }
      let lat = l.lat, lng = l.lng;
      const k = lat.toFixed(5) + ',' + lng.toFixed(5); const n = (seen[k] = (seen[k] || 0) + 1);
      if (n > 1) { lat += 0.00004 * n; lng += 0.00004 * n; }   // identical coordinates (re-posts): nudge a few metres so both stay clickable
      const stale = lastCrawl && l.last_seen !== lastCrawl;
      const off = offMarket(l);   // withdrawn / sold / reserved: grey fill, red ring
      const br = isBroker(l);     // owner / agent classifieds: pink ring, smaller and paler than NPA pins
      const m = L.circleMarker([lat, lng], starStyle(l, { radius: br ? 6 : 8, color: off ? '#c0392b' : br ? '#c2185b' : '#222', weight: off || br ? 2 : 1,
        fillColor: off ? '#bbb' : css(TYPE_COLOR[l.property_type] || '--other'), fillOpacity: stale ? .35 : br ? .6 : .85 }))
        .bindPopup(popup(l), { maxWidth: 300 });
      if (map.getZoom() >= LABEL_ZOOM) attachLabel(m, l); else m.bindTooltip(`${off ? term('avail', l.details.availability) + ' · ' : ''}${fmtPrice(l.price_thb)}${l.price_per_sqwa ? ' · ' + fmtPerRai(l) : ''} · ${term('type', l.property_type || 'other')}`);
      m.addTo(layer); markers.set(l.id, m);
    }
    const exploded = !$('agg').checked || map.getZoom() >= EXPLODE_ZOOM;
    for (const g of groups.values()) {
      if (exploded) {   // zoomed in: one dashed pin per listing, position = stable hash of the id (approximate, within the sub-district)
        const n = g.rows.length, R = g.rows[0].geo_precision === 'place' ? 0.0012 * Math.min(2, Math.sqrt(n)) : 0.0012 * Math.sqrt(n);
        for (const l of g.rows) {
          const h = hash(l.id), ang = (h % 3600) / 3600 * 2 * Math.PI, r = R * Math.sqrt(((h >>> 12) % 1000) / 1000);
          const lat = g.lat + r * Math.cos(ang), lng = g.lng + r * Math.sin(ang) / Math.cos(g.lat * Math.PI / 180);
          const off = offMarket(l), br = isBroker(l);
          const m = L.circleMarker([lat, lng], starStyle(l, { radius: br ? 6 : 8, color: off ? '#c0392b' : br ? '#c2185b' : '#222', weight: off || br ? 2 : 1, dashArray: '3,3',
            fillColor: off ? '#bbb' : css(TYPE_COLOR[l.property_type] || '--other'), fillOpacity: br ? .5 : .7 }))
            .bindPopup(popup(l), { maxWidth: 300 });
          if (map.getZoom() >= LABEL_ZOOM) attachLabel(m, l); else m.bindTooltip(`≈ ${esc(g.name)} · ${fmtPrice(l.price_thb)}${l.price_per_sqwa ? ' · ' + fmtPerRai(l) : ''} · ${term('type', l.property_type || 'other')}`);
          m.addTo(layer); markers.set(l.id, m);
        }
        continue;
      }
      const n = g.rows.length, size = Math.round(Math.min(50, 24 + 3 * Math.sqrt(n)));
      const byType = {}; g.rows.forEach(l => byType[l.property_type || 'other'] = (byType[l.property_type || 'other'] || 0) + 1);
      const m = L.marker([g.lat, g.lng], { icon: L.divIcon({ className: '', html: `<div class="agg" style="width:${size}px;height:${size}px">${n}</div>`, iconSize: [size, size], iconAnchor: [size / 2, size / 2] }), zIndexOffset: -1000 })
        .bindTooltip(`${esc(g.name)} · ${Object.entries(byType).map(([k, v]) => `${term('type', k)} ${v}`).join(' · ')}`)
        .bindPopup(aggPopup(g), { maxWidth: 360 });
      m.on('popupopen', e => { const a = e.popup.getElement().querySelector('.agg-list'); if (a) a.onclick = ev => { ev.preventDefault(); $('q').value = g.rows[0].tambon || ''; render(); }; });
      m.addTo(layer); g.rows.forEach(l => markers.set(l.id, m));
    }
    for (const t of TYPES) { const n = rows.filter(l => (l.property_type || 'other') === t).length; const el = $('n-' + t); if (el) el.textContent = `(${n})`; }
    $('count').textContent = t('shown', { n: rows.length, total: all.length });
    $('n-g-npa').textContent = `(${rows.filter(l => !isBroker(l)).length}/${all.filter(l => !isBroker(l)).length})`;
    $('n-g-broker').textContent = `(${rows.filter(isBroker).length}/${all.filter(isBroker).length})`;
    $('n-tgt').textContent = `(${all.filter(matchesTarget).length})`;
    $('n-dup').textContent = `(${all.filter(l => (l.details || {}).duplicate_of).length})`;
    renderUpdates();
    if ($('q').value.trim() && rows.length && rows.length <= 3) { const m = markers.get(rows[0].id); if (m) { map.setView(m.getLatLng(), 16); if (rows.length === 1) m.openPopup(); } }
    $('list').innerHTML = rows.map(l => `<div class="it ${lastCrawl && l.last_seen !== lastCrawl ? 'stale' : ''} ${offMarket(l) ? 'offm' : ''}" data-id="${esc(l.id)}">
      <span class="dot" style="background:${offMarket(l) ? '#bbb' : css(TYPE_COLOR[l.property_type] || '--other')}"></span>
      ${availHtml(l)}${targetBadge(l)}${flagBadges(l)} <span class="p">${fmtPrice(l.price_thb)}</span> <span class="m">${fmtArea(l.area_sqwa)}${l.price_per_sqwa ? ' · ' + fmtPerRai(l) : ''}</span><br>
      ${esc(heading(l))}<br><span class="m">${esc(tr(l.title || '').slice(0, 70))}</span><br><span class="m">${isBroker(l) ? groupBadge(l) : ''}${esc(l.source)} · ${esc(l.first_seen)}${l.auction_date ? ' · ' + t('auction') + ' ' + esc(l.auction_date) : ''}${zoneHtml(l) ? ' · ' + zoneHtml(l) : ''}${zoneHtml(l, 'zoning_draft') ? ' → ' + zoneHtml(l, 'zoning_draft') : ''}</span></div>`).join('');
    $('list').querySelectorAll('.it').forEach(el => el.onclick = () => { const m = markers.get(el.dataset.id); if (m) { map.setView(m.getLatLng(), 15); m.openPopup(); } });
  }

  // ---- latest-updates panel (data/updates.json, newest first; written by `crawl`)
  let events = [];
  function renderUpdates() {
    // follow the listing-group checkboxes so the panel shows the same population as the map
    const gNpa = $('g-npa').checked, gBroker = $('g-broker').checked;
    const shown = events.filter(e => kindOf(e.source) === 'broker' ? gBroker : gNpa);
    $('upd-hd').firstElementChild.textContent = `${t('updates')} (${shown.length})`;
    if (!shown.length) { $('upd-bd').innerHTML = `<div class="ev m">${t('ev_none')}</div>`; return; }
    const byDay = new Map();
    for (const e of shown) { if (!byDay.has(e.date)) byDay.set(e.date, []); byDay.get(e.date).push(e); }
    const byId = new Map(all.map(l => [l.id, l]));
    let html = '', first = true;
    for (const [day, evs] of byDay) {
      const counts = {}; evs.forEach(e => counts[e.kind] = (counts[e.kind] || 0) + 1);
      const summary = Object.entries(counts).map(([k, n]) => `${t('ev_' + k)} ${n}`).join(' · ');
      html += `<div class="day ${first ? '' : 'closed'}" data-day="${esc(day)}">${esc(day)} · ${esc(summary)}</div><div class="rows">`;
      for (const e of evs.slice(0, 60)) {
        const l = byId.get(e.id);
        const price = e.kind === 'price' ? `${fmtPrice(e.from)} → ${fmtPrice(e.to)}` : (l ? fmtPrice(l.price_thb) : (e.to != null ? fmtPrice(e.to) : ''));
        const where = l ? `${term('type', l.property_type || 'other')} · ${l.tambon ? tr(l.tambon) : ''}` : '';
        html += `<div class="ev" data-id="${esc(e.id)}"><span class="badge ${e.kind}">${t('ev_' + e.kind)}</span>${esc(price)} <span class="m">${esc(where)}</span><br><span class="m">${kindOf(e.source) === 'broker' ? `<span class="badge broker">${t('g_broker_s')}</span>` : ''}${esc(e.source)} · ${esc(tr(e.title || e.id).slice(0, 60))}</span></div>`;
      }
      if (evs.length > 60) html += `<div class="ev m">${t('ev_more', { n: evs.length - 60 })}</div>`;
      html += '</div>'; first = false;
    }
    $('upd-bd').innerHTML = html;
    $('upd-bd').querySelectorAll('.day').forEach(d => d.onclick = () => d.classList.toggle('closed'));
    $('upd-bd').querySelectorAll('.ev[data-id]').forEach(el => el.onclick = () => { const m = markers.get(el.dataset.id); if (m) { map.setView(m.getLatLng(), 15); m.openPopup(); } });
  }
  $('upd-hd').onclick = () => { $('updates').classList.toggle('closed'); $('upd-toggle').textContent = $('updates').classList.contains('closed') ? '▾' : '▴'; };
  fetch('data/updates.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).then(ev => { events = ev; renderUpdates(); }).catch(() => renderUpdates());

  function load(data) {
    all = Array.isArray(data) ? data : (data.listings || []);
    meta = data.meta || {}; lastCrawl = meta.last_crawl || null;
    const src = meta.sources || {};
    const bad = Object.entries(src).filter(([, r]) => r.status !== 'ok').map(([k, r]) => `${k}: ${r.status}${r.reason ? ' (' + r.reason + ')' : ''}`);
    $('meta').textContent = t('meta', { n: all.length, gen: data.generated || '?', crawl: lastCrawl || '?' }) + (bad.length ? ` · ${t('failed')}: ${bad.join('; ')}` : '');
    applyLang(); buildFilters(); render(); renderUpdates();
  }

  $('lang').addEventListener('change', () => { lang = $('lang').value; try { localStorage.setItem('samui-npa-lang', lang); } catch (e) {}
    applyLang(); if (all.length) { buildFilters(); render(); } renderUpdates(); });

  fetch('data/listings.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.json(); })
    .then(load)
    .catch(e => {
      $('err').innerHTML = `Could not load data/listings.json (${esc(e.message)}).\nServe this folder over HTTP, e.g. <code>python3 -m http.server 8765</code> in tools/samui-npa and open http://localhost:8765/viewer.html — or pick the file: `;
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json';
      inp.onchange = () => inp.files[0].text().then(t => { $('err').textContent = ''; load(JSON.parse(t)); });
      $('err').appendChild(inp);
    });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>打开 LED 详情页</title>
<style>
  /* A pass-through page: it holds no land data. The lot's fields travel after '#' in the link (never sent to this
     server) as JSON, raw deflate, base64url; the page posts them to LED's detail page, which answers only a POST. */
  :root { --bg: #ffffff; --ink: #17201b; --muted: #5b6961; --bad: #a8281f; --link: #0b6b3f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1411; --ink: #e7eee8; --muted: #9aada1; --bad: #f0776c; --link: #3fbf82; color-scheme: dark; } }
  body { margin: 0; padding: 28px max(16px, env(safe-area-inset-left, 0px)); background: var(--bg); color: var(--ink);
         font: 16px/1.6 "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; }
  p { margin: 0 0 10px; max-width: 60ch; }
  .muted { color: var(--muted); font-size: 14px; }
  .bad { color: var(--bad); }
  a { color: var(--link); }
</style>
</head>
<body>
<p id="msg">正在打开 LED 详情页…</p>
<p class="muted" id="what"></p>
<form id="f" method="POST" action="https://asset.led.go.th/newbidreg/asset_open.asp" accept-charset="UTF-8"></form>
<script>
(async () => {
  const msg = document.getElementById('msg'), what = document.getElementById('what');
  // only the fields of LED's own result-row form are passed on, short values only
  const ALLOWED = /^(AssetTypeID|ReserveFund1?|addrno|ampur|assetprice\d|assettypedesc|auc_asset_gen|biddate\d|city|debtprice|deed(ampur|city|no|tumbol)|eauc|fbidnuml?|fsubbidnum|is_extra_pledgb|ischeck_date|issale\d?|landdesc|landpicture|landtype|law_court_(id|name)|law_suit_(no|year)|map|mapjot|occupant|person1|province_(id|name)|quaterrai|rai|sale_location\d|sale_time\d|saletypename|str_bid_num|tel|tumbol|wa)$/;
  const fail = text => {
    msg.className = 'bad';
    msg.textContent = '打不开 LED 详情页：' + text;
    what.innerHTML = '可以在 <a href="https://asset.led.go.th/newbidreg/default.asp" rel="noopener">LED 搜索页</a> 按案号或地契号自己查。';
  };
  try {
    const h = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    if (!h) return fail('链接里没有地块信息。');
    if (typeof DecompressionStream !== 'function') return fail('这个浏览器太旧，换一个浏览器再打开这个链接。');
    const bytes = Uint8Array.from(atob(h + '='.repeat((4 - h.length % 4) % 4)), c => c.charCodeAt(0));
    const text = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    const fields = JSON.parse(text);
    const form = document.getElementById('f');
    let n = 0;
    for (const [k, v] of Object.entries(fields)) {
      if (!ALLOWED.test(k) || typeof v !== 'string' || v.length > 400) continue;
      form.appendChild(Object.assign(document.createElement('input'), { type: 'hidden', name: k, value: v }));
      n += 1;
    }
    if (!n || !fields.auc_asset_gen) return fail('链接里的地块信息不完整。');
    what.textContent = `案号 ${fields.law_suit_no || ''}/${fields.law_suit_year || ''} · 地契 ${fields.deedno || ''}`;
    form.submit();
  } catch (e) {
    fail('链接里的地块信息读不出来。');
  }
})();
</script>
</body>
</html>
